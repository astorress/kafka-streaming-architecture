name: kafka-streaming-architecture

x-kafka: &kafka
  image: apache/kafka:4.3.1
  restart: unless-stopped
  environment: &kafka-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

services:
  kafka1:
    <<: *kafka
    container_name: KafkaBroker1
    hostname: kafka1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,EXTERNAL://localhost:29092
    ports: ["29092:19092"]
    volumes: [kafka1-data:/var/lib/kafka/data]

  kafka2:
    <<: *kafka
    container_name: KafkaBroker2
    hostname: kafka2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092,EXTERNAL://localhost:29093
    ports: ["29093:19092"]
    volumes: [kafka2-data:/var/lib/kafka/data]

  kafka3:
    <<: *kafka
    container_name: KafkaBroker3
    hostname: kafka3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092,EXTERNAL://localhost:29094
    ports: ["29094:19092"]
    volumes: [kafka3-data:/var/lib/kafka/data]

  kafka-lab:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    image: kafka-streaming-architecture-lab:local
    container_name: KafkaLab
    hostname: kafka-lab
    volumes: ["..:/app"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka1:9092,kafka2:9092,kafka3:9092
      PYTHONPATH: /app/src
    ports: ["8893:8893"]
    working_dir: /app
    command: ["/bin/sh", "-c", "jupyter lab --allow-root --ip=0.0.0.0 --port=8893 --no-browser --ServerApp.token='' --ServerApp.password=''"]
    restart: unless-stopped
    depends_on: [kafka1, kafka2, kafka3]

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
